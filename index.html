<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <title>LinguaStart — запись на занятия</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">L</div>
      <div>
        <div class="brand-name">LinguaStart</div>
        <div class="brand-caption">Заявка на занятия</div>
      </div>
      <div class="step-counter" id="stepCounter">1 / 6</div>
    </header>

    <section class="progress" aria-label="Прогресс заполнения">
      <div class="progress-fill" id="progressFill"></div>
    </section>

    <section class="intro">
      <p class="eyebrow">ИНОСТРАННЫЕ ЯЗЫКИ</p>
      <h1 id="pageTitle">Начнём знакомство</h1>
      <p class="intro-text" id="pageSubtitle">Оставьте заявку на обучение — это займёт всего пару минут.</p>
    </section>

    <section id="screen" class="screen" aria-live="polite"></section>

    <div class="local-note" id="localNote" hidden>
      Предварительный просмотр. Для отправки заявки откройте приложение через Telegram.
    </div>

    <footer class="footer-note">Подберём удобный формат обучения и преподавателя</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
