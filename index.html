<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Иностранные языки</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="hero-icon" aria-hidden="true">🌍</div>
      <p class="eyebrow">LANGUAGE STUDIO</p>
      <h1>Какой язык<br>хотите изучать?</h1>
      <p class="subtitle">Выберите направление — мы поможем подобрать занятия и преподавателя.</p>
    </header>

    <section class="language-grid" aria-label="Доступные иностранные языки">
      <button class="language-card" type="button" data-language="en" aria-pressed="false">
        <span class="flag-wrap"><img src="assets/gb.svg" alt="Флаг Великобритании"></span>
        <span class="language-name">Английский</span>
        <span class="language-description">English</span>
        <span class="check-mark" aria-hidden="true">✓</span>
      </button>
      <button class="language-card" type="button" data-language="de" aria-pressed="false">
        <span class="flag-wrap"><img src="assets/de.svg" alt="Флаг Германии"></span>
        <span class="language-name">Немецкий</span>
        <span class="language-description">Deutsch</span>
        <span class="check-mark" aria-hidden="true">✓</span>
      </button>
      <button class="language-card" type="button" data-language="fr" aria-pressed="false">
        <span class="flag-wrap"><img src="assets/fr.svg" alt="Флаг Франции"></span>
        <span class="language-name">Французский</span>
        <span class="language-description">Français</span>
        <span class="check-mark" aria-hidden="true">✓</span>
      </button>
      <button class="language-card" type="button" data-language="es" aria-pressed="false">
        <span class="flag-wrap"><img src="assets/es.svg" alt="Флаг Испании"></span>
        <span class="language-name">Испанский</span>
        <span class="language-description">Español</span>
        <span class="check-mark" aria-hidden="true">✓</span>
      </button>
    </section>

    <p class="hint" id="hint">Нажмите на карточку, чтобы выбрать язык.</p>
    <button class="browser-submit" id="browser-submit" type="button" disabled>Подтвердить выбор</button>
    <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
    <footer>Выбор будет передан вашему Telegram-боту.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
