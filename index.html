<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6fb">
  <title>Запись на занятия — Иностранные языки</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="hero-icon" aria-hidden="true">🌍</div>
      <p class="eyebrow">LANGUAGE STUDIO</p>
      <div class="progress-track" aria-label="Прогресс заполнения">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="step-count" id="step-count">Шаг 1 из 6</p>
      <h1 id="step-title">Какой язык<br>хотите изучать?</h1>
      <p class="subtitle" id="step-description">Выберите направление — мы поможем подобрать занятия и преподавателя.</p>
    </header>

    <section class="step-content" id="step-content" aria-live="polite" aria-label="Анкета записи на занятия"></section>

    <div class="nav-actions">
      <button class="back-button" id="back-button" type="button" hidden>← Назад</button>
      <button class="browser-submit" id="browser-submit" type="button" disabled>Продолжить</button>
    </div>
    <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
    <footer>Заполнение анкеты · Оплата в тестовом режиме</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
